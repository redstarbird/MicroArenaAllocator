name: CI/CD Pipeline

on:
    push:
        branches: ["master"]
        tags:
            - "v*"
    pull_request:
        branches: ["master"]

jobs:
    test-platforms:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        # Create a matrix of different OS and CMake configurations to test various scenarios
        strategy:
            fail-fast: false # Allows all matrix jobs to complete even if one job fails
            matrix:
                include:
                    - name: "Linux (64-bit, Virtual Memory)"
                      os: ubuntu-latest
                      cmake_args: ""

                    - name: "Windows (64-bit, Virtual Memory)"
                      os: windows-latest
                      cmake_args: ""

                    - name: "macOS (Apple Silicon/ARM64, Virtual Memory)"
                      os: macos-latest
                      cmake_args: ""

                    - name: "macOS (Intel/x86_64, Virtual Memory)"
                      os: macos-15-intel
                      cmake_args: ""
                    - name: "Linux (32-bit, Virtual Memory)"
                      os: ubuntu-latest
                      cmake_args: "-DBUILD_32_BIT=ON"

                    - name: "Linux (64-bit, Malloc Fallback)"
                      os: ubuntu-latest
                      cmake_args: "-DFORCE_MALLOC_FALLBACK=ON"

                    - name: "Linux (32-bit, Malloc Fallback)"
                      os: ubuntu-latest
                      cmake_args: "-DFORCE_MALLOC_FALLBACK=ON -DBUILD_32_BIT=ON"

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # Install 32-bit C libraries on Linux if running the 32-bit test
            - name: Install 32-bit multilib (Linux Only)
              if: contains(matrix.name, 'Linux (32-bit')
              run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

            # Setup python to use for generating release artifacts
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            # Generate release artifacts to use for testing
            - name: Generate Release Artifacts
              run: python scripts/generate_header_release_files.py

            # Configure CMake using the specific arguments from the matrix
            - name: Configure CMake
              run: cmake -B build -S . -DTEST_RELEASE_ARTIFACTS=ON ${{ matrix.cmake_args }}

            - name: Build
              run: cmake --build build --config Debug

            # Run CTest
            - name: Run Tests
              working-directory: ./build
              run: ctest --output-on-failure -V -C Debug

    build-and-release:
        needs: test-platforms

        if: startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # Setup python to use for generating release artifacts
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Generate Release Files
              run: python scripts/generate_header_release_files.py

            # Extracts release notes using script
            - name: Extract Release Notes from CHANGELOG.md
              run: python scripts/extract_changelog_notes.py

              # Create the release
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  name: Release ${{github.ref_name}}
                  files: |
                      release_build/MicroArena.zip
                      release_build/single_header/MicroArena.h
                  body_path: release_notes.md
                  # Determine prerelease based on the tag
                  prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta')}}
                  draft: true
